server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # recover the real client IP from the TLS proxy (Caddy) on the private Docker network, for rate limiting
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.conf;

  # same-origin API => HttpOnly SameSite cookies work without CORS
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 512k;
  }

  # Processed video (HLS from the transcode worker). Every playlist/segment is checked against the viewer's open playback
  # session by the API before nginx serves the file, so media bytes follow the same rules as the API.
  location /vod/ {
    auth_request /_vod_authz;
    alias /srv/media/hls/;
    add_header Cache-Control "private, no-store";
    include /etc/nginx/security-headers.conf;
  }
  location = /_vod_authz {
    internal;
    proxy_pass http://api:8000/api/v1/playback/authorize-vod;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # hashed build assets are immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
