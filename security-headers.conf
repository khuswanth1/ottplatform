# Included by every location that sets its own add_header: nginx does NOT inherit server-level add_header
# directives into a location that defines any add_header of its own, which silently dropped the CSP from index.html.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Media/artwork come from TMDB images, the Internet Archive and your CDN: extend media-src / img-src for your hosts.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.razorpay.com https://image.tmdb.org https://archive.org https://*.archive.org; media-src 'self' blob: https:; frame-src https://archive.org https://www.youtube-nocookie.com https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; worker-src 'self' blob:" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
